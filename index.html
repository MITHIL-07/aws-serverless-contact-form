<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | AWS Student Builders Group</title>
  <meta name="description" content="Serverless contact form built with AWS S3, API Gateway, Lambda, DynamoDB and SES." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <header class="intro">
      <p class="badge">AWS Student Builders Group - LJIET</p>
      <h1>Get in touch</h1>
      <p class="lead">
        Have a question about our workshops or events? Send us a message and we will reply by email.
      </p>
    </header>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Contact form</h2>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Your name" maxlength="100" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" maxlength="254" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="subject">Subject <span class="optional">(optional)</span></label>
          <input type="text" id="subject" name="subject" placeholder="What is this about?" maxlength="150" />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Write your message here (at least 10 characters)" maxlength="2000" required></textarea>
          <p class="counter"><span id="char-count">0</span> / 2000</p>
        </div>

        <!-- Honeypot: hidden from real users. Bots that fill it are ignored by the backend. -->
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit-btn" class="btn">
          <span class="btn-text">Send message</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="footer">
      <p>Built with Amazon S3, API Gateway, AWS Lambda, DynamoDB and SES.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
